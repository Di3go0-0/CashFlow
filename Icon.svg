<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- moneda, dibujada antes para que el bolsillo de arriba la tape a medias -->
  <circle cx="512" cy="330" r="150" fill="url(#coin)"/>
  <circle cx="512" cy="330" r="150" fill="none" stroke="#b45309" stroke-width="12" opacity="0.5"/>
  <text x="512" y="398" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="200" text-anchor="middle" fill="#78350f">$</text>
  <!-- tres bolsillos apilados -->
  <rect x="192" y="690" width="640" height="150" rx="44" fill="#334155"/>
  <rect x="192" y="690" width="640" height="46" rx="23" fill="#64748b" opacity="0.35"/>
  <rect x="192" y="560" width="640" height="150" rx="44" fill="#475569"/>
  <rect x="192" y="560" width="640" height="46" rx="23" fill="#94a3b8" opacity="0.35"/>
  <rect x="192" y="430" width="640" height="150" rx="44" fill="url(#accent)"/>
  <rect x="192" y="430" width="640" height="46" rx="23" fill="#ccfbf1" opacity="0.45"/>
</svg>
