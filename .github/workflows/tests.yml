name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: CashFlowCore on Linux
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: SQLite headers for GRDB
        run: apt-get update && apt-get install -y libsqlite3-dev
      - name: Test
        run: swift test
